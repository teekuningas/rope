<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rope</title>
    <link rel="stylesheet" href="/src/game/styles/layout.css" />
    <link rel="stylesheet" href="/src/game/styles/hud.css" />
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" width="1024" height="768"></canvas>

      <!-- Mobile Touch Controls -->
      <div id="touch-controls" class="touch-hidden">
        <!-- Virtual Movement Joystick (Bottom Left) -->
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-thumb"></div>
          </div>
        </div>

        <!-- Touch Action Buttons (Bottom Right) -->
        <div id="action-cluster">
          <div class="action-row auxiliary-actions">
            <button id="btn-zoom-in" class="touch-btn sm-btn" aria-label="Zoom In" title="Zoom In">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button id="btn-zoom-out" class="touch-btn sm-btn" aria-label="Zoom Out" title="Zoom Out">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
          <div class="action-row main-actions">
            <button id="btn-inventory" class="touch-btn lg-btn" aria-label="Inventory" title="Inventory">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V5a3 3 0 0 0-6 0v2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2z"></path><path d="M10 5a2 2 0 0 1 4 0v2h-4V5z"></path><line x1="4" y1="13" x2="20" y2="13"></line><rect x="10" y="11" width="4" height="4" rx="1"></rect></svg>
            </button>
            <button id="btn-lightning" class="touch-btn lg-btn primary-btn" aria-label="Lightning" title="Lightning Strike">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="rgba(82, 108, 93, 0.45)" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="controls-overlay">
      <a href="index.html" class="back-link">&larr; Back</a>
      <span class="hints">WASD &middot; Space &middot; I</span>
      <button id="touch-mode-toggle" class="mode-toggle" title="Toggle touch controls">Touch: Auto</button>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
